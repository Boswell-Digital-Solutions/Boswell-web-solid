services:
  - type: web
    name: boswell-digital-solutions
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: node server/index.cjs
    healthCheckPath: /health
    # A documentation-only push must not build or deploy. Render evaluates
    # these globs from the repository root. Ignoring wins over including, and
    # an unknown new path still builds (fail-closed). No documentation file is
    # read by the build or the server, so nothing is re-included here.
    # render.yaml itself is always processed. Same rule as the CI paths filters.
    buildFilter:
      ignoredPaths:
        - docs/**
        - doc/**
        - "*.md"
        - "**/*.md"
    envVars:
      - key: NODE_ENV
        value: production
